name: Update DNB HTML

on:
  repository_dispatch:
    types: [update_dnb]

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode HTML from Power Automate
        run: |
          printf '%s' '${{ github.event.client_payload.html_b64 }}' | base64 --decode > index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet index.html; then
            echo "No changes to commit"
          else
            git add index.html
            git commit -m "Auto update QAH DNB HTML"
            git push
          fi
